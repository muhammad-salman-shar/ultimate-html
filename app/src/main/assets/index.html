<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate HTML</title>
<style>
  body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
  h1 { color: #1565C0; }
  .ok { background: #e8f5e9; padding: 12px; border-radius: 8px; color: #2e7d32; }
</style>
</head>
<body>
  <h1>Ultimate HTML</h1>
  <p class="ok">✓ WebView working. index.html loaded successfully.</p>
  <p id="ua"></p>
  <script>
    document.getElementById('ua').textContent = 'UA: ' + navigator.userAgent;
  </script>
</body>
</html>
